openapi: "3.1.0"

info:
  title: SoporteBot API
  description: >
    Jira support chatbot backend. Serves the chat UI and processes
    conversational messages through a LangChain agent that can search,
    create, and comment on Jira issues.
  version: "1.0.0"
  contact:
    name: AI4Devs 202602 Seniors
    url: https://lidr.co

servers:
  - url: http://localhost:8000
    description: Local development server

x-docs:
  swagger-ui: http://localhost:8000/api-docs
  redoc:      http://localhost:8000/api-docs/redoc
  openapi-json: http://localhost:8000/api-docs/openapi.json

tags:
  - name: ui
    description: Chat interface — serves the HTML frontend
  - name: chat
    description: Conversational API — the agent endpoint
  - name: docs
    description: API documentation — Swagger UI, ReDoc and raw OpenAPI spec

paths:

  # ── Chat interface ───────────────────────────────────────────────────────

  /:
    get:
      tags: [ui]
      operationId: serve_ui
      summary: Chat UI
      description: >
        Serves the single-page chat interface (public/index.html).
        The HTML file contains all CSS and JS inline; no separate static
        assets are required beyond jQuery and marked.js loaded from CDN.
      responses:
        "200":
          description: HTML page returned successfully
          content:
            text/html:
              schema:
                type: string
              example: "<!DOCTYPE html><html lang=\"es\">...</html>"
        "404":
          description: index.html not found on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: "index.html not found"

  # ── Chat API ─────────────────────────────────────────────────────────────

  /askbot:
    post:
      tags: [chat]
      operationId: askbot
      summary: Send a message to SoporteBot
      description: >
        Accepts a user message and a session identifier. The session ID
        is used to maintain conversation history in memory across turns.
        The agent may call Jira tools (search, create, comment) or query
        the RAG document store before returning its reply.

        The caller must generate a stable session_id per conversation
        (e.g. "sess_" + Math.random().toString(36).substring(2,15))
        and send it unchanged on every subsequent turn.

        The endpoint returns HTTP 503 if the LangChain chain failed to
        initialise (missing API key or import error at startup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskBotRequest"
            examples:
              first_message:
                summary: User reports a bug
                value:
                  msg: "El botón de login no funciona en producción"
                  session_id: "sess_abc123"
              confirmation:
                summary: User confirms ticket creation
                value:
                  msg: "Sí, crea el ticket"
                  session_id: "sess_abc123"
              comment_on_existing:
                summary: User adds a comment to an existing ticket
                value:
                  msg: "Añade al ticket SUP-42 que ya lo estamos revisando"
                  session_id: "sess_abc123"
              technical_question:
                summary: User asks a technical question (triggers rag_docs)
                value:
                  msg: "¿Cómo configuramos las variables de entorno en este proyecto?"
                  session_id: "sess_abc123"
      responses:
        "200":
          description: Bot reply returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskBotResponse"
              examples:
                search_result:
                  summary: Agent found a similar ticket
                  value:
                    msg: >
                      He encontrado un ticket similar: [SUP-38] Login falla en
                      producción | Estado: In Progress | Asignado: Ana García.
                      ¿Quieres añadir un comentario en lugar de abrir uno nuevo?
                    session_id: "sess_abc123"
                confirmation_prompt:
                  summary: Agent asks for confirmation before creating
                  value:
                    msg: |
                      Voy a crear este ticket en Jira:
                      - Proyecto:    SUP
                      - Tipo:        Bug
                      - Resumen:     Login falla en producción
                      - Prioridad:   High
                      - Descripción: Los usuarios reciben un error 500 al intentar iniciar sesión.

                      ¿Confirmas que lo cree?
                    session_id: "sess_abc123"
                ticket_created:
                  summary: Ticket created successfully
                  value:
                    msg: "✅ Ticket creado: SUP-42 — https://your-org.atlassian.net/browse/SUP-42"
                    session_id: "sess_abc123"
        "422":
          description: Request validation failed (empty msg, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                detail:
                  - loc: ["body", "msg"]
                    msg: "msg must not be blank"
                    type: "value_error"
        "503":
          description: >
            LangChain chain not initialised. Caused by a missing
            OPENAI_API_KEY or an import error at startup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPError"
              example:
                detail: "Chat service unavailable: chain not initialized"

  # ── API documentation ────────────────────────────────────────────────────

  /api-docs:
    get:
      tags: [docs]
      operationId: swagger_ui
      summary: Swagger UI
      description: >
        Interactive API documentation rendered by Swagger UI.
        Allows exploring and executing both endpoints directly from the browser.
        Configured in FastAPI via docs_url="/api-docs".
      responses:
        "200":
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /api-docs/redoc:
    get:
      tags: [docs]
      operationId: redoc_ui
      summary: ReDoc UI
      description: >
        Alternative API documentation rendered by ReDoc.
        Read-only view with a three-panel layout.
        Configured in FastAPI via redoc_url="/api-docs/redoc".
      responses:
        "200":
          description: ReDoc HTML page
          content:
            text/html:
              schema:
                type: string

  /api-docs/openapi.json:
    get:
      tags: [docs]
      operationId: openapi_schema
      summary: OpenAPI JSON schema
      description: >
        Raw OpenAPI 3.1.0 schema in JSON format.
        Consumed by Swagger UI and ReDoc to render the documentation.
        Configured in FastAPI via openapi_url="/api-docs/openapi.json".
      responses:
        "200":
          description: OpenAPI schema object
          content:
            application/json:
              schema:
                type: object
                description: OpenAPI 3.1.0 schema

components:
  schemas:

    AskBotRequest:
      type: object
      required:
        - msg
        - session_id
      properties:
        msg:
          type: string
          minLength: 1
          description: >
            Message from the user. Leading and trailing whitespace is
            stripped before processing. Must not be blank after stripping.
          example: "El botón de login no funciona en producción"
        session_id:
          type: string
          minLength: 1
          description: >
            Opaque identifier for the conversation session. Must remain
            constant across all turns of the same conversation. Generated
            by the client (e.g. "sess_" + Math.random().toString(36).substring(2,15)).
          example: "sess_abc123"

    AskBotResponse:
      type: object
      required:
        - msg
        - session_id
      properties:
        msg:
          type: string
          description: >
            Reply from the bot. May contain Markdown (the UI renders it
            via marked.js). May include Jira ticket keys, URLs, or
            structured confirmation summaries.
          example: "✅ Ticket creado: SUP-42 — https://your-org.atlassian.net/browse/SUP-42"
        session_id:
          type: string
          description: Same session_id echoed back from the request.
          example: "sess_abc123"

    HTTPError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable error message.
          example: "index.html not found"

    ValidationError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  type: string
                example: ["body", "msg"]
              msg:
                type: string
                example: "msg must not be blank"
              type:
                type: string
                example: "value_error"
