<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: #fff;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            line-height: 1.45;
            font-size: 15px;
            word-wrap: break-word;
        }

        .message.bot {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: #007bff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.error {
            align-self: flex-start;
            background: #f8d7da;
            color: #721c24;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            padding: 14px;
            border-top: 1px solid #e9ecef;
            background: #fafafa;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: #007bff;
        }

        .chat-input-area button {
            margin-left: 10px;
            padding: 12px 24px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Asistente Virtual</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    (function () {
        var sessionId = "sess_" + Math.random().toString(36).substring(2, 15);

        function escapeHtml(text) {
            var div = document.createElement("div");
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        function appendMessage(text, role) {
            var cls = "message " + role;
            var bubble = $('<div class="' + cls + '"></div>');
            if (role === "bot") {
                bubble.html(marked.parse(text));
            } else {
                bubble.html(escapeHtml(text));
            }
            $("#chatMessages").append(bubble);
            var container = document.getElementById("chatMessages");
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            var input = $("#msgInput");
            var text = input.val().trim();
            if (!text) return;

            appendMessage(text, "user");
            input.val("");

            $.ajax({
                url: "/askbot",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ msg: text, session_id: sessionId }),
                dataType: "json",
                success: function (response) {
                    appendMessage(response.msg, "bot");
                },
                error: function (xhr) {
                    var detail = "Something went wrong. Please try again.";
                    try {
                        var body = JSON.parse(xhr.responseText);
                        if (body.detail) detail = body.detail;
                    } catch (e) { /* use default */ }
                    appendMessage("Error: " + detail, "error");
                }
            });
        }

        $("#sendBtn").on("click", sendMessage);

        $("#msgInput").on("keypress", function (e) {
            if (e.which === 13) sendMessage();
        });

        appendMessage("¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte hoy?", "bot");
    })();
    </script>
</body>
</html>
